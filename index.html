<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rodovia do Deserto</title>
<style>
:root{--ink:#241a14;--sand:#f1dfbd;--red:#d9432b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--ink);color:var(--sand);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));
  overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;
}
#stage{
  position:relative;width:min(100%,960px,calc((100vh - 150px) * 1.6));
  aspect-ratio:8/5;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px #0009;background:#000;
}
canvas{display:block;width:100%;height:100%}
.panel{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;text-align:center;padding:16px;background:rgba(36,26,20,.62);
}
.panel[hidden]{display:none}
.panel h1{margin:0;font-size:clamp(26px,6vw,52px);letter-spacing:.5px;color:#fff3d6}
.panel p{margin:0;max-width:34ch;font-size:clamp(14px,2.4vw,18px);line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
#startBtn{
  background:var(--red);color:#fff7ea;border:0;border-radius:8px;
  padding:14px 30px;font-size:20px;font-weight:700;margin-top:6px;
}
button:focus-visible{outline:3px solid #fff3d6;outline-offset:3px}
#pad{display:none;width:min(100%,960px);justify-content:space-between;gap:12px}
#pad .grp{display:flex;gap:10px;flex:1}
#pad .grp:last-child{justify-content:flex-end}
#pad button{
  flex:1;max-width:150px;height:78px;border-radius:14px;border:2px solid #6a5242;
  background:#3a2c23;font-size:22px;font-weight:700;touch-action:none;
}
#pad button.on{background:#6a5242}
#pad .g.on{background:#2f7d4a;border-color:#4fae6f}
#pad .b.on{background:#a8321f;border-color:#d9432b}
@media (pointer:coarse){#pad{display:flex}#hint{display:none}#stage{width:min(100%,960px,calc((100vh - 190px) * 1.6))}}
footer{display:flex;align-items:center;gap:14px;font-size:14px;opacity:.85}
#muteBtn{background:none;border:1px solid #6a5242;border-radius:6px;padding:4px 10px}
</style>
</head>
<body>

<div id="stage">
  <canvas id="c" width="800" height="500"></canvas>
  <div class="panel" id="panel">
    <h1 id="title">Rodovia do Deserto</h1>
    <p id="msg">Complete 4 fases, cada uma com cenário e tráfego diferentes. Você tem 3 vidas por fase.</p>
    <button id="startBtn">Dirigir</button>
  </div>
</div>

<div id="pad">
  <div class="grp">
    <button data-k="left" aria-label="Esquerda">◀</button>
    <button data-k="right" aria-label="Direita">▶</button>
  </div>
  <div class="grp">
    <button data-k="brake" class="b">Freio</button>
    <button data-k="gas" class="g">Acelerar</button>
  </div>
</div>

<footer>
  <span id="hint">Setas ou WASD para dirigir · P pausa · M som</span>
  <button id="muteBtn" aria-pressed="false">Som: ligado</button>
</footer>

<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 800, H = 500;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Parâmetros da estrada (projeção pseudo-3D) ---------- */
const segL = 200, roadW = 2000, camH = 1000, drawDist = 220, lanes = 3;
const camDepth = 1 / Math.tan(100 / 2 * Math.PI / 180);
const playerZ = camH * camDepth;
const step = 1 / 60;
const maxSpeed = segL / step;
const accel = maxSpeed / 5, braking = -maxSpeed, decel = -maxSpeed / 5;
const offDecel = -maxSpeed / 2, offLimit = maxSpeed / 4, centrifugal = 0.3;
const CAR_W = 440; // largura do carro em unidades do mundo

/* ---------- Pista ---------- */
const PHASES = [
  { name: 'Deserto',  laps: 3, traffic: 12, spd: 1.0,  curve: 1.0, scenery: 'cactus', night: false,
    sky: ['#7fb9cf', '#f6e3b8'], fog: [246, 227, 184], ground: ['#e3c48f', '#d9b47a'], rumble: ['#d9432b', '#f4efe4'],
    road: ['#4a4d57', '#454852'], ridge: ['#c9a07d', '#a8795a'], sun: '#fff3d1', rock: '#9b7b5c', leaf: '#4f7a43' },
  { name: 'Pradaria', laps: 4, traffic: 16, spd: 1.1,  curve: 1.1, scenery: 'tree', night: false,
    sky: ['#6fb3e0', '#e6f2d8'], fog: [230, 242, 216], ground: ['#6fae52', '#639f48'], rumble: ['#d9432b', '#f4efe4'],
    road: ['#4a4d57', '#454852'], ridge: ['#86ab86', '#5e8a64'], sun: '#fffbe0', rock: '#8a8a82', leaf: '#3f8a3a' },
  { name: 'Neve',     laps: 4, traffic: 20, spd: 1.2,  curve: 1.15, scenery: 'pine', night: false,
    sky: ['#9db6cc', '#eef3f7'], fog: [238, 243, 247], ground: ['#f4f7fa', '#e1e8ee'], rumble: ['#3a6ea5', '#f4efe4'],
    road: ['#5a5f6b', '#555a66'], ridge: ['#c3d0dc', '#a3b4c4'], sun: '#ffffff', rock: '#9aa5b0', leaf: '#2f6b4a' },
  { name: 'Noite',    laps: 5, traffic: 24, spd: 1.3,  curve: 1.25, scenery: 'tree', night: true,
    sky: ['#0d1230', '#2a3566'], fog: [26, 32, 70], ground: ['#2a3a2f', '#243229'], rumble: ['#d9432b', '#c9c9d0'],
    road: ['#2e3038', '#2a2c34'], ridge: ['#1c2347', '#141a38'], sun: '#e8ecff', rock: '#4a4a55', leaf: '#1f4a2a' }
];
let phaseIdx = 0, ph = PHASES[0];
const segs = [];
let curveMul = 1, nSeg = 0, trackLen = 0, LAPS = 3, goal = 0;
const ease = {
  in: (a, b, p) => a + (b - a) * p * p,
  io: (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5)
};
function addSeg(curve) {
  const n = segs.length;
  segs.push({ i: n, curve: curve * curveMul, z1: n * segL, z2: (n + 1) * segL, sprites: [], cars: [], p1: {}, p2: {}, vis: false });
}
function addRoad(e, h, l, c) {
  for (let i = 0; i < e; i++) addSeg(ease.in(0, c, i / e));
  for (let i = 0; i < h; i++) addSeg(c);
  for (let i = 0; i < l; i++) addSeg(ease.io(c, 0, i / l));
}
const LAYOUT = [[30,0,0,0],[25,35,25,2],[10,30,10,0],[20,30,20,-3],[25,35,25,4],[15,40,15,0],
  [25,30,25,-5],[20,20,20,3],[20,25,20,-2],[25,40,25,6],[15,30,15,-6],[30,40,30,0],
  [20,30,20,4],[20,30,20,-4],[25,40,25,2],[30,50,30,0]];
const SPRITE_DIMS = { cactus: [260, 800], tree: [420, 900], pine: [360, 1000], rock: [420, 280] };

// Monta a pista e o cenário da fase atual. A linha de chegada fica no segmento 0.
function buildTrack() {
  segs.length = 0; curveMul = ph.curve;
  LAYOUT.forEach(l => addRoad(...l));
  nSeg = segs.length; trackLen = nSeg * segL;
  LAPS = ph.laps; goal = LAPS * trackLen;
  for (let i = 12; i < nSeg; i += 5) {
    const type = Math.random() < 0.25 ? 'rock' : ph.scenery;
    segs[i].sprites.push({
      off: (Math.random() < 0.5 ? -1 : 1) * (1.35 + Math.random() * 2),
      type, w: SPRITE_DIMS[type][0], h: SPRITE_DIMS[type][1]
    });
  }
}
buildTrack();

/* ---------- Estado ---------- */
const keys = { left: false, right: false, gas: false, brake: false };
const cars = [];
const carColors = ['#2f6fb0', '#e0b12c', '#4a9a62', '#f0efe9', '#7b4aa0', '#2b2b30', '#e07a2c'];
let state = 'menu', paused = false, muted = false;
let pos = 0, px = 0, speed = 0, dist = 0, lives = 3, inv = 0, shake = 0, steer = 0, bgOff = 0, clock = 0, raceTime = 0, banner = 0;
const bestTimes = [];
PHASES.forEach((_, i) => { try { bestTimes[i] = +localStorage.getItem('rodovia-best-time-' + i) || 0; } catch (e) { bestTimes[i] = 0; } });
const activeCars = () => Math.min(36, ph.traffic + Math.floor(dist / trackLen) * 2);
const fmtT = t => Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0').replace('.', ',');

function initCars() {
  cars.length = 0;
  const per = 12, spacing = trackLen / per, scale = (trackLen - 12000) / trackLen;
  const laneOff = [-0.667, 0, 0.667], laneSpd = [0.27, 0.2, 0.34];
  const ranks = [...Array(per * 3).keys()].sort(() => Math.random() - 0.5);
  let r = 0;
  for (let l = 0; l < 3; l++) for (let k = 0; k < per; k++) {
    const raw = k * spacing + l * spacing / 3 + (Math.random() - 0.5) * spacing * 0.3;
    cars.push({
      z: 6000 + raw * scale, off: laneOff[l], speed: laneSpd[l] * maxSpeed * ph.spd,
      color: carColors[(Math.random() * carColors.length) | 0], rank: ranks[r++]
    });
  }
}
initCars();

function resetGame() {
  ph = PHASES[phaseIdx]; buildTrack();
  pos = 0; px = 0; speed = 0; dist = 0; lives = 3; inv = 0; shake = 0; steer = 0; raceTime = 0; banner = 3;
  initCars(); state = 'play'; paused = false;
  document.getElementById('panel').hidden = true;
  audioStart();
}

function showPanel(title, msg, btn) {
  document.getElementById('title').textContent = title;
  document.getElementById('msg').textContent = msg;
  document.getElementById('startBtn').textContent = btn;
  document.getElementById('panel').hidden = false;
  document.getElementById('startBtn').focus();
}

function gameOver() {
  state = 'over';
  const lap = Math.min(LAPS, Math.floor(dist / trackLen) + 1);
  showPanel('Fim de corrida', `Você bateu na volta ${lap}/${LAPS} da fase ${phaseIdx + 1} (${ph.name}).`, 'Tentar a fase de novo');
}

function finish() {
  state = 'over';
  let rec = '';
  const i = phaseIdx;
  if (!bestTimes[i] || raceTime < bestTimes[i]) {
    bestTimes[i] = raceTime; rec = ' Novo recorde!';
    try { localStorage.setItem('rodovia-best-time-' + i, raceTime); } catch (e) {}
  }
  const info = `Tempo: ${fmtT(raceTime)}. Melhor da fase: ${fmtT(bestTimes[i])}.${rec}`;
  if (i < PHASES.length - 1) {
    phaseIdx = i + 1;
    showPanel(`Fase ${i + 1} concluída!`, info, `Fase ${phaseIdx + 1}: ${PHASES[phaseIdx].name}`);
  } else {
    phaseIdx = 0;
    showPanel('Você venceu!', `Você terminou as ${PHASES.length} fases. ${info}`, 'Jogar de novo');
  }
  tone(660, 0.25);
}

/* ---------- Áudio (motor simples) ---------- */
let ac, osc, gain;
function audioStart() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    ac.resume();
    if (!osc) {
      osc = ac.createOscillator(); gain = ac.createGain();
      osc.type = 'sawtooth'; osc.frequency.value = 45; gain.gain.value = 0;
      osc.connect(gain).connect(ac.destination); osc.start();
    }
  } catch (e) {}
}
function audioUpdate(sp) {
  if (!osc) return;
  const on = state === 'play' && !paused && !muted;
  osc.frequency.setTargetAtTime(45 + sp * 110, ac.currentTime, 0.05);
  gain.gain.setTargetAtTime(on ? 0.03 : 0, ac.currentTime, 0.08);
}
function tone(f, d) {
  if (!ac || muted) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.08, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

/* ---------- Lógica ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const findSeg = z => segs[Math.floor(((z % trackLen) + trackLen) % trackLen / segL) % nSeg];

function crash() {
  lives--; inv = 2; shake = 0.5;
  speed = Math.min(speed, maxSpeed * 0.12);
  tone(110, 0.3);
  if (lives <= 0) gameOver();
}

function update(dt) {
  clock += dt;
  if (banner > 0) banner -= dt;
  const seg = findSeg(pos + playerZ);

  // Cenário passando ao fundo / modo vitrine no menu
  if (state !== 'play') {
    pos = (pos + dt * maxSpeed * 0.35) % trackLen;
    bgOff += seg.curve * 0.35 * dt * 25;
    for (const c of cars) c.z = (c.z + c.speed * dt) % trackLen;
    audioUpdate(0);
    return;
  }

  const sp = speed / maxSpeed;
  const dx = dt * 2 * sp;

  pos = (pos + dt * speed) % trackLen;
  dist += dt * speed;
  raceTime += dt;
  if (dist >= goal) { finish(); return; }
  bgOff += seg.curve * sp * dt * 25;

  const target = keys.left ? -1 : keys.right ? 1 : 0;
  if (keys.left && !keys.right) px -= dx; else if (keys.right && !keys.left) px += dx;
  steer += (target - steer) * Math.min(1, dt * 10);
  px -= dx * sp * seg.curve * centrifugal;

  if (keys.gas) speed += accel * dt;
  else if (keys.brake) speed += braking * dt;
  else speed += decel * dt;
  if ((px < -1 || px > 1) && speed > offLimit) speed += offDecel * dt;
  px = clamp(px, -2.4, 2.4);
  speed = clamp(speed, 0, maxSpeed);

  if (inv > 0) inv -= dt;
  if (shake > 0) shake -= dt;

  // Tráfego
  const active = activeCars();
  const pz = pos + playerZ;
  for (const c of cars) {
    c.z = (c.z + c.speed * dt) % trackLen;
    if (c.rank >= active || inv > 0) continue;
    let d = c.z - pz;
    d = ((d + trackLen / 2) % trackLen + trackLen) % trackLen - trackLen / 2;
    if (Math.abs(d) < segL * 1.3 && Math.abs(px - c.off) < 0.2) {
      c.z = (pos + trackLen * 0.5) % trackLen;
      px += (px >= c.off ? 1 : -1) * 0.15;
      crash();
      break;
    }
  }

  // Obstáculos na margem
  if (inv <= 0 && state === 'play' && Math.abs(px) > 1) {
    for (const s of seg.sprites) {
      if (Math.abs(px - s.off) < 0.2) { px = Math.sign(px) * 0.95; crash(); break; }
    }
  }
  audioUpdate(sp);
}

/* ---------- Desenho ---------- */
function poly(x1, y1, x2, y2, x3, y3, x4, y4, c) {
  ctx.fillStyle = c; ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
  ctx.closePath(); ctx.fill();
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.fill();
}
function proj(p, camX, camZ) {
  p.camZ = p.z - camZ;
  p.scale = camDepth / p.camZ;
  p.sx = Math.round(W / 2 + p.scale * (0 - camX) * W / 2);
  p.sy = Math.round(H / 2 + p.scale * camH * H / 2);
  p.sw = Math.round(p.scale * roadW * W / 2);
}
function ridge(off, amp, base, color, k) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(-20, H / 2 + 2);
  for (let x = -20; x <= W + 20; x += 10) {
    const t = (x + off) * k;
    const y = H / 2 - base - amp * (0.55 * Math.sin(t) + 0.3 * Math.sin(t * 2.3 + 1) + 0.15 * Math.sin(t * 5.1 + 2) + 1) * 0.5;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 20, H / 2 + 2); ctx.closePath(); ctx.fill();
}

function drawCar(x, y, w, color, lit) {
  const h = w * 0.62;
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(x, y, w * 0.55, w * 0.07, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#16161a';
  rr(x - w * 0.5, y - h * 0.3, w * 0.15, h * 0.3, w * 0.02);
  rr(x + w * 0.35, y - h * 0.3, w * 0.15, h * 0.3, w * 0.02);
  // cabine
  ctx.fillStyle = color;
  rr(x - w * 0.34, y - h, w * 0.68, h * 0.52, w * 0.1);
  ctx.fillStyle = '#1d2630';
  rr(x - w * 0.27, y - h * 0.93, w * 0.54, h * 0.34, w * 0.06);
  // carroceria
  ctx.fillStyle = color;
  rr(x - w * 0.46, y - h * 0.62, w * 0.92, h * 0.5, w * 0.07);
  // faixa sombra
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  rr(x - w * 0.46, y - h * 0.2, w * 0.92, h * 0.1, w * 0.03);
  // lanternas
  ctx.fillStyle = lit ? '#ff6a4d' : '#a3281a';
  rr(x - w * 0.43, y - h * 0.55, w * 0.2, h * 0.13, w * 0.02);
  rr(x + w * 0.23, y - h * 0.55, w * 0.2, h * 0.13, w * 0.02);
  if (lit) { ctx.fillStyle = 'rgba(255,90,60,.35)'; rr(x - w * 0.5, y - h * 0.6, w, h * 0.23, w * 0.05); }
  // placa
  ctx.fillStyle = '#efe9d6';
  rr(x - w * 0.1, y - h * 0.45, w * 0.2, h * 0.1, w * 0.01);
}

function drawSprite(s, x, y, w, h) {
  if (s.type === 'cactus') {
    ctx.fillStyle = '#4f7a43';
    rr(x - w * 0.14, y - h, w * 0.28, h, w * 0.14);
    rr(x - w * 0.5, y - h * 0.58, w * 0.36, w * 0.12, w * 0.06);
    rr(x - w * 0.5, y - h * 0.58 - h * 0.22, w * 0.12, h * 0.22 + w * 0.12, w * 0.06);
    rr(x + w * 0.14, y - h * 0.45, w * 0.36, w * 0.12, w * 0.06);
    rr(x + w * 0.38, y - h * 0.45 - h * 0.2, w * 0.12, h * 0.2 + w * 0.12, w * 0.06);
  } else if (s.type === 'tree') {
    ctx.fillStyle = '#6b4a2f';
    ctx.fillRect(x - w * 0.06, y - h * 0.38, w * 0.12, h * 0.38);
    ctx.fillStyle = ph.leaf;
    ctx.beginPath(); ctx.ellipse(x, y - h * 0.65, w * 0.5, h * 0.35, 0, 0, 7); ctx.fill();
  } else if (s.type === 'pine') {
    ctx.fillStyle = '#5a4030';
    ctx.fillRect(x - w * 0.05, y - h * 0.25, w * 0.1, h * 0.25);
    for (let i = 0; i < 3; i++) {
      const ty = y - h * (0.18 + i * 0.25), bw = w * (0.5 - i * 0.13);
      ctx.fillStyle = ph.leaf;
      ctx.beginPath(); ctx.moveTo(x - bw, ty); ctx.lineTo(x + bw, ty); ctx.lineTo(x, ty - h * 0.38); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f4f7fa';
      ctx.beginPath(); ctx.moveTo(x - bw * 0.45, ty - h * 0.2); ctx.lineTo(x + bw * 0.45, ty - h * 0.2); ctx.lineTo(x, ty - h * 0.38); ctx.closePath(); ctx.fill();
    }
  } else {
    ctx.fillStyle = ph.rock;
    ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.lineTo(x - w * 0.3, y - h * 0.8);
    ctx.lineTo(x + w * 0.1, y - h); ctx.lineTo(x + w * 0.45, y - h * 0.5); ctx.lineTo(x + w / 2, y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.moveTo(x + w * 0.1, y - h); ctx.lineTo(x + w * 0.45, y - h * 0.5);
    ctx.lineTo(x + w / 2, y); ctx.lineTo(x + w * 0.1, y); ctx.closePath(); ctx.fill();
  }
}

function render() {
  const sp = speed / maxSpeed;
  const base = findSeg(pos);
  const basePct = (pos % segL) / segL;
  const camX0 = px * roadW;
  const amp = reduceMotion ? 0 : 1;

  ctx.save();
  if (shake > 0 && amp) ctx.translate((Math.random() - 0.5) * 18 * shake, (Math.random() - 0.5) * 14 * shake);

  // céu
  const g = ctx.createLinearGradient(0, 0, 0, H / 2);
  g.addColorStop(0, ph.sky[0]); g.addColorStop(1, ph.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H / 2 + 22);
  // sol
  ctx.fillStyle = 'rgba(255,243,209,.35)';
  ctx.beginPath(); ctx.arc(W * 0.72, H * 0.3, 70, 0, 7); ctx.fill();
  ctx.fillStyle = ph.sun;
  ctx.beginPath(); ctx.arc(W * 0.72, H * 0.3, 44, 0, 7); ctx.fill();
  ridge(bgOff * 0.3, 70, 10, ph.ridge[0], 0.006);
  ridge(bgOff * 0.6, 45, 0, ph.ridge[1], 0.011);
  ctx.fillStyle = ph.ground[1]; ctx.fillRect(-20, H / 2, W + 40, H / 2 + 20);

  // estrada
  let maxY = H, x = 0, dx = -(base.curve * basePct);
  for (let n = 0; n < drawDist; n++) {
    const seg = segs[(base.i + n) % nSeg];
    seg.vis = false;
    const looped = seg.i < base.i;
    const camZ = pos - (looped ? trackLen : 0);
    seg.p1.z = seg.z1; seg.p2.z = seg.z2;
    proj(seg.p1, camX0 - x, camZ);
    proj(seg.p2, camX0 - x - dx, camZ);
    x += dx; dx += seg.curve;
    if (seg.p1.camZ <= camDepth || seg.p2.sy >= maxY) continue;
    seg.vis = true;

    const p1 = seg.p1, p2 = seg.p2;
    const light = Math.floor(seg.i / 3) % 2 === 0;
    const r1 = p1.sw / Math.max(6, 2 * lanes), r2 = p2.sw / Math.max(6, 2 * lanes);
    ctx.fillStyle = light ? ph.ground[0] : ph.ground[1];
    ctx.fillRect(-20, p2.sy, W + 40, p1.sy - p2.sy);
    const rc = light ? ph.rumble[0] : ph.rumble[1];
    poly(p1.sx - p1.sw - r1, p1.sy, p1.sx - p1.sw, p1.sy, p2.sx - p2.sw, p2.sy, p2.sx - p2.sw - r2, p2.sy, rc);
    poly(p1.sx + p1.sw + r1, p1.sy, p1.sx + p1.sw, p1.sy, p2.sx + p2.sw, p2.sy, p2.sx + p2.sw + r2, p2.sy, rc);
    poly(p1.sx - p1.sw, p1.sy, p1.sx + p1.sw, p1.sy, p2.sx + p2.sw, p2.sy, p2.sx - p2.sw, p2.sy, light ? ph.road[0] : ph.road[1]);
    if (light) {
      const l1 = p1.sw / Math.max(32, 8 * lanes), l2 = p2.sw / Math.max(32, 8 * lanes);
      const lw1 = p1.sw * 2 / lanes, lw2 = p2.sw * 2 / lanes;
      let lx1 = p1.sx - p1.sw + lw1, lx2 = p2.sx - p2.sw + lw2;
      for (let l = 1; l < lanes; l++, lx1 += lw1, lx2 += lw2)
        poly(lx1 - l1 / 2, p1.sy, lx1 + l1 / 2, p1.sy, lx2 + l2 / 2, p2.sy, lx2 - l2 / 2, p2.sy, '#f4efe4');
    }
    if (seg.i < 2) {
      for (let c = 0; c < 10; c++) {
        const a = c / 10, b = (c + 1) / 10;
        poly(p1.sx - p1.sw + 2 * p1.sw * a, p1.sy, p1.sx - p1.sw + 2 * p1.sw * b, p1.sy,
             p2.sx - p2.sw + 2 * p2.sw * b, p2.sy, p2.sx - p2.sw + 2 * p2.sw * a, p2.sy,
             (c + seg.i) % 2 ? '#16161a' : '#f4efe4');
      }
    }
    // neblina de distância
    const fog = Math.pow(n / drawDist, 2.2);
    if (fog > 0.02) {
      ctx.fillStyle = `rgba(${ph.fog},${Math.min(0.95, fog)})`;
      ctx.fillRect(-20, p2.sy, W + 40, p1.sy - p2.sy);
    }
    maxY = p2.sy;
  }

  // distribuir carros por segmento
  for (let n = 0; n < drawDist; n++) segs[(base.i + n) % nSeg].cars.length = 0;
  const active = state === 'play' ? activeCars() : 18;
  for (const c of cars) {
    if (c.rank >= active) continue;
    segs[Math.floor(c.z / segL) % nSeg].cars.push(c);
  }

  // sprites, de trás para frente
  for (let n = drawDist - 1; n >= 0; n--) {
    const seg = segs[(base.i + n) % nSeg];
    if (!seg.vis) continue;
    const p1 = seg.p1, p2 = seg.p2;
    const fog = Math.pow(n / drawDist, 2.2);
    for (const s of seg.sprites) {
      const sc = p1.scale, sx = p1.sx + sc * s.off * roadW * W / 2;
      const w = s.w * sc * W / 2, h = s.h * sc * W / 2;
      if (w < 1) continue;
      drawSprite(s, sx, p1.sy, w, h);
      if (fog > 0.02) { ctx.fillStyle = `rgba(${ph.fog},${Math.min(0.95, fog)})`; ctx.fillRect(sx - w, p1.sy - h - 2, w * 2, h + 4); }
    }
    if (seg.i === 0) {
      const sc = p1.scale, k = sc * W / 2;
      const lx = p1.sx - 1.12 * roadW * k, rx = p1.sx + 1.12 * roadW * k;
      if (k * 1000 > 2) {
        ctx.fillStyle = '#2a2220';
        ctx.fillRect(lx - 60 * k, p1.sy - 1500 * k, 120 * k, 1500 * k);
        ctx.fillRect(rx - 60 * k, p1.sy - 1500 * k, 120 * k, 1500 * k);
        ctx.fillStyle = '#d9432b';
        ctx.fillRect(lx - 60 * k, p1.sy - 1500 * k, rx - lx + 120 * k, 340 * k);
        const cell = 85 * k, cols = Math.ceil((rx - lx + 120 * k) / cell);
        for (let r = 0; r < 4; r++) for (let c = 0; c < cols; c++) {
          ctx.fillStyle = (r + c) % 2 ? '#16161a' : '#f4efe4';
          ctx.fillRect(lx - 60 * k + c * cell, p1.sy - 1500 * k + r * cell, cell, cell);
        }
        if (fog > 0.02) { ctx.fillStyle = `rgba(${ph.fog},${Math.min(0.95, fog)})`; ctx.fillRect(lx - 60 * k, p1.sy - 1500 * k, rx - lx + 120 * k, 1500 * k); }
      }
    }
    for (const c of seg.cars) {
      const t = (c.z % segL) / segL;
      const sc = lerp(p1.scale, p2.scale, t);
      const sx = lerp(p1.sx, p2.sx, t) + sc * c.off * roadW * W / 2;
      const sy = lerp(p1.sy, p2.sy, t);
      const w = CAR_W * sc * W / 2;
      if (w < 1) continue;
      drawCar(sx, sy, w, c.color, false);
      if (fog > 0.02) { ctx.fillStyle = `rgba(${ph.fog},${Math.min(0.95, fog)})`; ctx.fillRect(sx - w * 0.6, sy - w * 0.7, w * 1.2, w * 0.75); }
    }
  }

  if (ph.night && state === 'play') {
    ctx.fillStyle = 'rgba(255,240,180,.16)';
    ctx.beginPath(); ctx.moveTo(W / 2 - 70, H - 30); ctx.lineTo(W / 2 + 70, H - 30);
    ctx.lineTo(W / 2 + 20, H * 0.56); ctx.lineTo(W / 2 - 20, H * 0.56); ctx.closePath(); ctx.fill();
  }

  // carro do jogador
  if (state === 'play' || state === 'menu') {
    const blink = inv > 0 && Math.floor(clock * 14) % 2 === 0;
    if (!blink && state === 'play') {
      const pw = W * 0.22;
      const bob = Math.sin(clock * 40) * (sp * 1.5);
      ctx.save();
      ctx.translate(W / 2, H - 22 + bob);
      ctx.rotate(steer * 0.05);
      if (Math.abs(px) > 1 && speed > 1000) {
        ctx.fillStyle = 'rgba(217,180,122,.7)';
        for (let i = 0; i < 6; i++) {
          ctx.beginPath();
          ctx.arc((Math.random() - 0.5) * pw * 1.3, -Math.random() * 16, 4 + Math.random() * 8, 0, 7);
          ctx.fill();
        }
      }
      drawCar(0, 0, pw, '#d9432b', keys.brake);
      ctx.restore();
    }
  }
  ctx.restore();

  if (state === 'play') drawHud(sp);
  if (paused) {
    ctx.fillStyle = 'rgba(36,26,20,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff3d6'; ctx.font = '700 44px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('Pausado', W / 2, H / 2); ctx.textAlign = 'left';
  }
}

function drawHud(sp) {
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(36,26,20,.55)';
  rr(12, 12, 150, 54, 8);
  rr(12, H - 76, 150, 64, 8);
  rr(W - 132, 12, 120, 40, 8);
  rr(W / 2 - 62, 12, 124, 40, 8);
  ctx.fillStyle = '#fff3d6';
  ctx.font = '700 28px "Trebuchet MS", sans-serif';
  ctx.fillText('Volta ' + Math.min(LAPS, Math.floor(dist / trackLen) + 1) + '/' + LAPS, 24, 48);
  ctx.textAlign = 'center'; ctx.font = '700 24px "Trebuchet MS", sans-serif';
  ctx.fillText(fmtT(raceTime), W / 2, 40); ctx.textAlign = 'left';
  ctx.font = '700 28px "Trebuchet MS", sans-serif';
  ctx.font = '700 40px "Trebuchet MS", sans-serif';
  ctx.fillText(String(Math.round(sp * 240)), 24, H - 28);
  ctx.font = '600 16px "Trebuchet MS", sans-serif';
  ctx.fillText('km/h', 92, H - 28);
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < lives ? '#d9432b' : 'rgba(241,223,189,.25)';
    rr(W - 122 + i * 36, 22, 28, 20, 5);
  }
  if (banner > 0) {
    ctx.globalAlpha = Math.min(1, banner);
    ctx.fillStyle = 'rgba(36,26,20,.6)'; rr(W / 2 - 190, H * 0.28, 380, 90, 12);
    ctx.fillStyle = '#fff3d6'; ctx.textAlign = 'center';
    ctx.font = '700 38px "Trebuchet MS", sans-serif';
    ctx.fillText(`Fase ${phaseIdx + 1} · ${ph.name}`, W / 2, H * 0.28 + 44);
    ctx.font = '600 18px "Trebuchet MS", sans-serif';
    ctx.fillText(`${LAPS} voltas`, W / 2, H * 0.28 + 72);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
}

/* ---------- Entrada ---------- */
const keyMap = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
  ArrowUp: 'gas', w: 'gas', W: 'gas', ArrowDown: 'brake', s: 'brake', S: 'brake' };
addEventListener('keydown', e => {
  const k = keyMap[e.key];
  if (k) { keys[k] = true; e.preventDefault(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && state !== 'play') { e.preventDefault(); resetGame(); }
  else if (e.key === ' ' && state === 'play') { keys.brake = true; e.preventDefault(); }
  else if (e.key === 'p' || e.key === 'P') { if (state === 'play') paused = !paused; }
  else if (e.key === 'm' || e.key === 'M') toggleMute();
});
addEventListener('keyup', e => {
  const k = keyMap[e.key];
  if (k) keys[k] = false;
  if (e.key === ' ') keys.brake = false;
});
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; b.classList.add('on'); audioStart(); };
  const off = () => { keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => b.addEventListener(t, off));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
document.getElementById('startBtn').addEventListener('click', resetGame);
function toggleMute() {
  muted = !muted;
  const b = document.getElementById('muteBtn');
  b.textContent = muted ? 'Som: desligado' : 'Som: ligado';
  b.setAttribute('aria-pressed', muted);
}
document.getElementById('muteBtn').addEventListener('click', toggleMute);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---------- Loop ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= step) { if (!paused) update(step); acc -= step; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
